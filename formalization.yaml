      note: "Full (high confidence, an auditor’s reading): theorem_1_1 carries the whole statement for every ν > 0: the force, compact set and fields with all listed properties, and no global smooth solution with uniformly bounded kinetic energy for the same force and zero datum (lim sup ‖u(t)‖_L∞ = ∞ is stated as unbounded speed near t = 1). The project's Comparator declaration navier_stokes_breakdown_R3 carries only the non-existence consequence, in Fefferman's alternative (C) form: some datum and a force in the decay class admit no smooth solution of bounded energy; it does not state the blowup construction or the compact support of the force."
